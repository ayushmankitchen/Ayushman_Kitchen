name: Production checks
on:
  push:
    branches: [main, "audit/**"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27019:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests --integration -q
      - run: python scripts/load_test.py --concurrency 100
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'
